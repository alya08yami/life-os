<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app reaches the screen edges, safe areas are padded by the layout.
         maximum-scale=1 stops iOS from zooming in when a text field gets focus; pinch zoom still works on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>LIFE OS</title>
    <meta name="description" content="LIFE OS — личный органайзер. Записи хранятся на этом устройстве." />
    <meta name="life-os-base" content="/life-os" />
    <link rel="manifest" href="/life-os/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/life-os/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/life-os/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f0f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LIFE OS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* iOS 26 tints the status-bar area (and the bottom edge) with the page's body background, not with theme-color.
         So the body must match the colour each screen shows at the top: the app updates it per screen
         (graphite only on the Soft Future home screen). Start light so no dark haze appears before the app paints. */
      html, body { background: var(--boot-bg, #f4f0f2); overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    </style>
    <script>
      /* First frame in the remembered theme's colours (set by the app after each launch), so start-up never flashes another theme. */
      (function () {
        try {
          var t = localStorage.getItem('life-os.theme') || 'soft';
          var home = /^\/(life-os\/?)?$/.test(location.pathname);
          var bg = { soft: home ? '#35343D' : '#f4f0f2', light: '#F6F5F3', dark: '#1B2037', minimal: '#f0dce3', mist: '#ededff', warm: '#f6f2ed' }[t] || '#f4f0f2';
          document.documentElement.style.setProperty('--boot-bg', bg);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <noscript> LIFE OS работает с включённым JavaScript. </noscript>
    <div id="root"></div>
    <script>
      /* Installable web app: cache the app files for offline start and quick updates. Records stay in IndexedDB and are never cached here. */
      (function () {
        var base = document.querySelector('meta[name="life-os-base"]').content;
        if (base.indexOf('%') !== -1 || !('serviceWorker' in navigator)) return;
        window.addEventListener('load', function () {
          navigator.serviceWorker.register(base + '/sw.js', { scope: base + '/' }).catch(function () {});
        });
      })();
    </script>
  <script src="/life-os/_expo/static/js/web/entry-66663e5907b4e69ac81ca5eedb208609.js" defer></script>
</body>
</html>
