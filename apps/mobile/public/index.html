<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app reaches the screen edges, safe areas are padded by the layout.
         maximum-scale=1 stops iOS from zooming in when a text field gets focus; pinch zoom still works on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="LIFE OS — личный органайзер. Записи хранятся на этом устройстве." />
    <meta name="life-os-base" content="%BASE%" />
    <link rel="manifest" href="%BASE%/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE%/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE%/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#35343D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LIFE OS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* Graphite while the app starts, matching the Soft Future home screen; each screen paints its own background. */
      html, body { background: #35343D; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    </style>
  </head>

  <body>
    <noscript> LIFE OS работает с включённым JavaScript. </noscript>
    <div id="root"></div>
    <script>
      /* Installable web app: cache the app files for offline start and quick updates. Records stay in IndexedDB and are never cached here. */
      (function () {
        var base = document.querySelector('meta[name="life-os-base"]').content;
        if (base.indexOf('%') !== -1 || !('serviceWorker' in navigator)) return;
        window.addEventListener('load', function () {
          navigator.serviceWorker.register(base + '/sw.js', { scope: base + '/' }).catch(function () {});
        });
      })();
    </script>
  </body>
</html>
